<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블랙홀 프라이데이 신규 변장 </title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Noto+Sans:wght@400;500;700;900&display=swap">
<link rel="stylesheet" id="font-ko" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap">
<style>
/* Layout: 블랙홀 링 히어로(8종 라인업) → 적용 가이드 3칸 → 변장별 [일러스트 | 플레이 영상 | 효과] 카드 → 안내사항 */
:root {
  --void: #07060b;
  --panel: #110f19;
  --panel-2: #191624;
  --line: #2b2639;
  --ink: #f4eff9;
  --dim: #aaa0bc;
  --faint: #6f6681;
  --pink: #ff288c;
  --gold: #ffd541;
  --orange: #ff9d42;
  --purple: #b98cff;
  --f-body: "Noto Sans", system-ui, sans-serif;
  --f-disp: "Unbounded", "Noto Sans", system-ui, sans-serif;
  --w-disp: 800;
  --f-mark: "Unbounded", "Noto Sans", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html:lang(ko) { --f-body: "Noto Sans KR", "Noto Sans", system-ui, sans-serif; --f-disp: "Black Han Sans", "Noto Sans KR", sans-serif; --w-disp: 400; }
html:lang(ja) { --f-body: "Noto Sans JP", "Noto Sans", system-ui, sans-serif; --f-disp: "Dela Gothic One", "Noto Sans JP", sans-serif; --w-disp: 400; }
html:lang(zh-Hant) { --f-body: "Noto Sans TC", "Noto Sans", system-ui, sans-serif; --f-disp: "Noto Sans TC", sans-serif; --w-disp: 900; }
html:lang(zh-Hans) { --f-body: "Noto Sans SC", "Noto Sans", system-ui, sans-serif; --f-disp: "Noto Sans SC", sans-serif; --w-disp: 900; }
html:lang(th) { --f-body: "Noto Sans Thai", "Noto Sans", system-ui, sans-serif; --f-disp: "Noto Sans Thai", sans-serif; --w-disp: 900; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--void);
}
.wrap {
  max-width: 1180px; margin-inline: auto;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ---------- top bar ---------- */
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.mark { font-family: var(--f-mark); font-weight: 800; font-style: italic; letter-spacing: .02em; font-size: 20px; color: var(--ink); }
.lang { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
.lang select {
  appearance: none; background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 34px 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%;
  background-size: 5px 5px; background-repeat: no-repeat;
}

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; padding-top: 28px; isolation: isolate; }
.hero::before { /* starfield */
  content: ""; position: absolute; inset: 0; z-index: -2; opacity: .7;
  background-image:
    radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 38%, var(--gold) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 64%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 58%, var(--pink) 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 80%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 46% 8%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 94% 86%, #fff 50%, transparent 51%);
}
.hole {
  position: absolute; z-index: -1; left: 50%; top: 58%;
  width: min(118vw, 1020px); aspect-ratio: 1; max-width: none;
  transform: translate(-50%, -50%); pointer-events: none;
}
.hole::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 20deg, var(--pink), var(--gold), #ff6a3d, var(--pink), #6b34ff, var(--pink));
  -webkit-mask: radial-gradient(circle, transparent 33%, #000 36%, #000 41%, transparent 53%);
          mask: radial-gradient(circle, transparent 33%, #000 36%, #000 41%, transparent 53%);
  filter: blur(22px); opacity: .55;
  animation: spin 60s linear infinite;
}
.hole::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 33.4%, rgba(255, 213, 65, .85) 34%, rgba(255, 40, 140, .5) 35%, transparent 37%),
    radial-gradient(circle, var(--void) 0 33.5%, transparent 34%);
}
@keyframes spin { to { transform: rotate(1turn); } }

.hero-copy { text-align: center; position: relative; }
.eyebrow {
  font-family: var(--f-mark); font-weight: 700; font-size: 12px;
  letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px;
}
html:lang(ko) .eyebrow, html:lang(ja) .eyebrow, html:lang(zh-Hant) .eyebrow, html:lang(zh-Hans) .eyebrow, html:lang(th) .eyebrow { letter-spacing: .14em; }
.hero h1 {
  font-family: var(--f-disp); font-weight: var(--w-disp);
  font-size: clamp(38px, 7.4vw, 76px); line-height: 1.08; margin: 0;
  text-wrap: balance; letter-spacing: -.01em;
  text-shadow: 0 0 40px rgba(255, 40, 140, .35);
}
.hero h1 .n { color: var(--pink); }
.hero .sub { color: var(--dim); max-width: 34em; margin: 18px auto 0; text-wrap: balance; font-size: clamp(14px, 1.6vw, 16px); }

.lineup {
  display: flex; justify-content: center; align-items: flex-end;
  margin-top: clamp(20px, 4vw, 40px); padding-inline: 2%;
}
.lineup img {
  width: min(17.5%, 190px); margin-inline: calc(-1 * min(3.6%, 38px));
  aspect-ratio: 1300 / 2048; object-fit: contain; object-position: bottom;
  filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .7));
  animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
}
.lineup img:nth-child(odd) { transform: translateY(4%); }
.lineup img.front { position: relative; z-index: 1; }
.lineup img:nth-child(1) { animation-delay: .05s } .lineup img:nth-child(2) { animation-delay: .1s }
.lineup img:nth-child(3) { animation-delay: .15s } .lineup img:nth-child(4) { animation-delay: .2s }
.lineup img:nth-child(5) { animation-delay: .25s } .lineup img:nth-child(6) { animation-delay: .3s }
.lineup img:nth-child(7) { animation-delay: .35s } .lineup img:nth-child(8) { animation-delay: .4s }
@keyframes rise { from { translate: 0 28px; } to { translate: 0 0; } }
.hero-floor { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }

/* ---------- sticky nav ---------- */
.kitnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--void) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.kitnav .wrap { padding-block: 10px; }
.kitnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.kitnav ul::-webkit-scrollbar { display: none; }
/* 넓은 화면은 줄바꿈해서 전부 보이게(마우스로는 가로로 밀 수 없음), 휴대폰 폭은 밀어서 넘김 */
@media (min-width: 700px) {
  .kitnav ul { flex-wrap: wrap; overflow-x: visible; }
}
.kitnav a {
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 4px 14px 4px 4px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
  color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 500;
  transition: border-color .2s, color .2s;
}
.kitnav a img { width: 28px; height: 28px; border-radius: 50%; background: var(--panel); object-fit: cover; }
.kitnav a:hover { color: var(--ink); }
.kitnav a[aria-current="true"] { color: var(--ink); border-color: var(--pink); }

/* ---------- section headings ---------- */
.section { padding-block: clamp(48px, 7vw, 88px) 0; }
.sec-head { margin-bottom: 28px; }
.sec-head .eyebrow { margin-bottom: 10px; }
.sec-head h2 {
  font-family: var(--f-disp); font-weight: var(--w-disp);
  font-size: clamp(24px, 3.4vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance;
}
.sec-head p { margin: 10px 0 0; color: var(--dim); font-size: 14px; }

/* ---------- guide ---------- */
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.guide article {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.guide .ico { height: 34px; display: flex; align-items: center; gap: 6px; }
.guide h3 { margin: 0; font-size: 17px; font-weight: 700; }
.guide p { margin: 0; color: var(--dim); font-size: 14px; }
.tier-scale { font-family: var(--f-mark); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--faint); }
.tier-scale span { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); }
.tier-scale span:last-child { background: var(--gold); color: #1a1406; border-color: var(--gold); }
.base-dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6c9, var(--gold) 55%, #b98400); }
.star { width: 28px; height: 28px; flex: none; }
.star.orange { color: var(--orange); } .star.purple { color: var(--purple); }

/* ---------- kits ---------- */
.kits { display: grid; gap: clamp(20px, 3vw, 32px); }
.kit {
  background: linear-gradient(180deg, var(--panel-2), var(--panel) 40%);
  border: 1px solid var(--line); border-radius: 22px;
  padding: clamp(16px, 2.6vw, 28px);
  scroll-margin-top: calc(var(--nav-h, 60px) + 12px);
}
.kit-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 18px; }
.kit-head .hero-name {
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--pink); border: 1px solid color-mix(in srgb, var(--pink) 45%, transparent);
  border-radius: 999px; padding: 2px 10px;
}
.kit-head h3 {
  font-family: var(--f-disp); font-weight: var(--w-disp);
  font-size: clamp(22px, 3vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance;
}
.kit-body {
  display: grid; gap: clamp(12px, 2vw, 22px);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "art play" "fx fx";
}
@media (min-width: 1000px) {
  .kit-body { grid-template-columns: minmax(0, .92fr) minmax(0, .78fr) minmax(0, 1.5fr); grid-template-areas: "art play fx"; align-items: start; }
}
.art, .play { aspect-ratio: 874 / 1426; max-width: 100%; border-radius: 16px; margin: 0; position: relative; overflow: hidden; }
.art { grid-area: art; background:
  radial-gradient(60% 40% at 50% 62%, rgba(255, 40, 140, .28), transparent 70%),
  radial-gradient(80% 50% at 50% 100%, rgba(255, 213, 65, .14), transparent 70%),
  var(--panel); border: 1px solid var(--line); }
.art img { position: absolute; inset: 4% 2% 0; width: 96%; height: 96%; object-fit: contain; object-position: bottom; }

.play {
  grid-area: play; display: block; width: 100%; padding: 0; cursor: pointer;
  background: #000; border: 1px solid var(--line); color: var(--ink); font: inherit;
  box-shadow: inset 0 0 0 5px #0b0a10;
}
.play.empty { cursor: default; }
.play .media, .play canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.play .badge {
  position: absolute; left: 10px; top: 10px; z-index: 2;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 4px 9px; border-radius: 999px; background: rgba(7, 6, 11, .72); color: var(--ink);
}
.play .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
.play.paused .badge i { background: var(--faint); box-shadow: none; }
.play .soon {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px;
  padding: 16px; text-align: center;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 4px),
    radial-gradient(70% 45% at 50% 45%, rgba(185, 140, 255, .16), transparent 70%),
    #0c0a12;
}
.play .soon svg { width: 46px; height: 46px; color: var(--faint); }
.play .soon strong { font-size: 13px; font-weight: 700; color: var(--dim); }
.play .soon small { font-family: var(--f-mark); font-size: 10px; letter-spacing: .24em; color: var(--faint); }

.fx { grid-area: fx; display: grid; gap: 12px; min-width: 0; }
.fx-block { background: var(--void); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.fx-block h4 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.fx-block h4 .star { width: 18px; height: 18px; }
.fx-block h4 .base-dot { width: 14px; height: 14px; }
.fx-base p { margin: 0; font-size: 15px; }
.fx b { font-weight: 700; }
.fx-base b { color: var(--gold); }
.fx-crown.orange h4 { color: var(--orange); } .fx-crown.orange b { color: var(--orange); }
.fx-crown.purple h4 { color: var(--purple); } .fx-crown.purple b { color: var(--purple); }
.tiers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tiers li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.tiers .tier {
  font-size: 11px; font-weight: 700; white-space: nowrap; text-align: center; min-width: 58px;
  padding: 3px 8px; border-radius: 6px; margin-top: 1px;
  border: 1px solid var(--line); color: var(--dim);
}
.tiers li:last-child .tier { color: #160f02; background: var(--gold); border-color: var(--gold); }
.tiers p { margin: 0; font-size: 14px; color: var(--ink); }

/* ---------- outro & notice ---------- */
.outro { text-align: center; padding-block: clamp(56px, 8vw, 96px) 0; }
.outro h2 { font-family: var(--f-disp); font-weight: var(--w-disp); font-size: clamp(24px, 3.6vw, 36px); margin: 0; text-wrap: balance; }
.outro h2 em { font-style: normal; color: var(--pink); }
.outro p { color: var(--dim); margin: 10px 0 0; }
.notice { margin-block: clamp(48px, 7vw, 72px) 56px; border-top: 1px solid var(--line); padding-top: 24px; }
.notice h2 { font-size: 13px; font-weight: 700; color: var(--dim); margin: 0 0 8px; }
.notice ul { margin: 0; padding-left: 18px; color: var(--faint); font-size: 13px; display: grid; gap: 2px; }
.foot { padding-bottom: 28px; color: var(--faint); font-size: 12px; }
.foot .mark { font-size: 14px; color: var(--faint); }

@media (max-width: 560px) {
  .tiers li { grid-template-columns: 1fr; gap: 4px; }
  .tiers .tier { justify-self: start; min-width: 0; }
  .kit-head h3 { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hole::before, .lineup img { animation: none; }
}
</style>

<header class="topbar">

      <select id="lang-select"></select>

<script>
/* 플레이 영상: 변장 ID → 파일 경로. 원본 GIF(40~100MB)는 폭 400px MP4(H.264, CRF 26)로 변환해 넣었습니다.
   .gif / .webp 는 <img>, .mp4 / .webm 은 <video> 로 재생됩니다. */
const PLAY = {
  Ketchapi_Nurse_BF: "play/Ketchapi_Nurse_BF.mp4",
  Gum_Spy_BF: "play/Gum_Spy_BF.mp4",
  Mamba_Dancer_BF: "play/Mamba_Dancer_BF.mp4",
  Laika_Explorer_BF: "play/Laika_Explorer_BF.mp4",
  Alpha_Pinky_BF: "play/Alpha_Pinky_BF.mp4",
  Yoyo_TroubleMaker_BF: "play/Yoyo_TroubleMaker_BF.mp4",
  Alpha_MatchGirl_BF: "play/Alpha_MatchGirl_BF.mp4",
  Dice_Queen_BF: "play/Dice_Queen_BF.mp4",
};

const LANGS = [
  { k: "kr", html: "ko", name: "한국어" },
  { k: "en", html: "en", name: "English" },
  { k: "jp", html: "ja", name: "日本語" },
  { k: "tc", html: "zh-Hant", name: "繁體中文" },
  { k: "sc", html: "zh-Hans", name: "简体中文" },
  { k: "sp", html: "es", name: "Español" },
  { k: "pt", html: "pt", name: "Português" },
  { k: "vi", html: "vi", name: "Tiếng Việt" },
  { k: "th", html: "th", name: "ไทย" },
];
const FONTS = {
  ko: "Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans",
  ja: "Noto+Sans+JP:wght@400;500;700;900&family=Dela+Gothic+One",
  "zh-Hant": "Noto+Sans+TC:wght@400;500;700;900",
  "zh-Hans": "Noto+Sans+SC:wght@400;500;700;900",
  th: "Noto+Sans+Thai:wght@400;500;700;900",
};

/* 표시 순서(상단 일러스트·탭·카드 공통). 일러스트는 뒤에 오는 것이 앞의 것을 덮는데,
   라이카는 얼굴(코기)이 이미지 오른쪽에 있어 오른쪽 이웃보다 위에 그립니다(.front). */

const ASSET = {};
const res = path => ASSET[path] || path;

const slug = id =>id.toLowerCase().replace(/_/g, "-");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function loadFont(htmlLang) {
  const fam = FONTS[htmlLang];
  if (!fam || document.getElementById("font-" + htmlLang)) return;
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.id = "font-" + htmlLang;
  l.href = "https://fonts.googleapis.com/css2?family=" + fam + "&display=swap";
  document.head.appendChild(l);
}

function playMarkup(id, t) {
  const src = PLAY[id];
  if (!src) {
    return `<div class="play empty" role="img" aria-label="${esc(t.playSoon)}">
      <span class="soon"><svg><use href="#i-play"/></svg><strong>${esc(t.playSoon)}</strong><small>COMING SOON</small></span></div>`;
  }
  const isVideo = /\.(mp4|webm)$/i.test(src);
  const media = isVideo
    ? `<video class="media" data-src="${esc(res(src))}" muted loop playsinline preload="none"></video>`
    : `<img class="media" src="${esc(res(src))}" alt="" loading="lazy" decoding="async">`;
  return `<button type="button" class="play" aria-pressed="false" aria-label="${esc(t.play)}">
    ${media}<canvas hidden></canvas>
    <span class="badge"><i></i><span class="badge-t">${esc(t.play)}</span></span></button>`;
}

function star(cls) { return `<svg class="star ${cls}" aria-hidden="true"><use href="#i-star"/></svg>`; }

function crownBlock(crown, cls, title, t, lang) {
  const order = [["Low", t.tierLow], ["Medium", t.tierMedium], ["High", t.tierHigh]];
  return `<section class="fx-block fx-crown ${cls}">
    <h4>${star(cls)}${esc(title)}</h4>
    <ol class="tiers">${order.map(([k, label]) =>
      `<li><span class="tier">${esc(label)}</span><p>${crown.tiers[k][lang]}</p></li>`).join("")}</ol>
  </section>`;
}

function render(lang) {
  const meta = LANGS.find(l => l.k === lang) || LANGS[0];
  const t = I18N[meta.k];
  document.documentElement.lang = meta.html;
  loadFont(meta.html);
  document.title = t.event + " · " + t.title;

  document.querySelectorAll("[data-i]").forEach(el => {
    const v = t[el.dataset.i];
    if (v != null) el.textContent = v;
  });
  $("#list-hint").hidden = Object.keys(PLAY).length === 0;

  $("#lineup").innerHTML = DATA.map(k =>
    `<img src="${res(`img/${k.id}.webp`)}" alt="" decoding="async"${k.id === "Laika_Explorer_BF" ? ' class="front"' : ""}>`).join("");

  $("#kitnav").innerHTML = DATA.map(k =>
    `<li><a href="#${slug(k.id)}"><img src="${res(`img/${k.id}_face.webp`)}" alt="" loading="lazy">${esc(k.name[meta.k])}</a></li>`).join("");

  $("#kits").innerHTML = DATA.map(k => `
    <article class="kit" id="${slug(k.id)}">
      <header class="kit-head">
        <span class="hero-name">${esc(k.heroName[meta.k])}</span>
        <h3>${esc(k.name[meta.k])}</h3>
      </header>
      <div class="kit-body">
        <figure class="art"><img src="${res(`img/${k.id}.webp`)}" alt="${esc(k.name[meta.k])}" loading="lazy" decoding="async"></figure>
        ${playMarkup(k.id, t)}
        <div class="fx">
          <section class="fx-block fx-base">
            <h4><span class="base-dot" aria-hidden="true"></span>${esc(t.base)}</h4>
            <p>${k.base[meta.k]}</p>
          </section>
          ${crownBlock(k.crowns.B, "orange", t.orange, t, meta.k)}
          ${crownBlock(k.crowns.A, "purple", t.purple, t, meta.k)}
        </div>
      </div>
    </article>`).join("");

  wirePlayers(t);
  lazyVideos();
  watchNav();
  syncNavHeight();
}

// 탭이 두 줄이 되면 높이가 바뀌므로, 탭 클릭 시 카드 제목이 탭 아래에 오도록 높이를 반영
function syncNavHeight() {
  document.documentElement.style.setProperty("--nav-h", document.querySelector(".kitnav").offsetHeight + "px");
}
addEventListener("resize", syncNavHeight);

function wirePlayers(t) {
  document.querySelectorAll("button.play").forEach(btn => {
    btn.addEventListener("click", () => {
      const media = btn.querySelector(".media");
      const cv = btn.querySelector("canvas");
      const label = btn.querySelector(".badge-t");
      const paused = btn.classList.toggle("paused");
      btn.setAttribute("aria-pressed", String(paused));
      label.textContent = paused ? t.paused : t.play;
      if (media.tagName === "VIDEO") { paused ? media.pause() : media.play().catch(() => {}); return; }
      if (paused) {
        // GIF는 일시정지 API가 없어서, 현재 프레임을 캔버스에 찍어 덮습니다.
        cv.width = media.naturalWidth || 300; cv.height = media.naturalHeight || 490;
        try { cv.getContext("2d").drawImage(media, 0, 0, cv.width, cv.height); } catch (e) {}
        cv.hidden = false;
      } else {
        cv.hidden = true;
      }
    });
  });
}

// <video> 는 loading="lazy" 가 없어서, 화면에 가까워질 때 소스를 넣고 재생합니다.
let videoObserver;
function lazyVideos() {
  if (videoObserver) videoObserver.disconnect();
  videoObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const v = e.target;
      videoObserver.unobserve(v);
      const src = v.dataset.src;
      // 단일 HTML 버전의 data URI 는 Blob URL 로 바꿔 넣어야 모든 브라우저에서 안정적으로 재생됩니다.
      const ready = src.startsWith("data:")
        ? fetch(src).then(r => r.blob()).then(b => URL.createObjectURL(b))
        : Promise.resolve(src);
      ready.then(url => {
        v.src = url;
        if (!v.closest(".play").classList.contains("paused")) v.play().catch(() => {});
      });
    });
  }, { rootMargin: "600px 0px" });
  document.querySelectorAll("video.media[data-src]").forEach(v => videoObserver.observe(v));
}

let navObserver;
function watchNav() {
  if (navObserver) navObserver.disconnect();
  const links = new Map([...document.querySelectorAll("#kitnav a")].map(a => [a.getAttribute("href").slice(1), a]));
  navObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => a.removeAttribute("aria-current"));
      const a = links.get(e.target.id);
      if (a) { a.setAttribute("aria-current", "true"); a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll(".kit").forEach(el => navObserver.observe(el));
}

function initialLang() {
  try { const s = localStorage.getItem("bf-lang"); if (s && I18N[s]) return s; } catch (e) {}
  const nav = (navigator.language || "ko").toLowerCase();
  if (nav.startsWith("ko")) return "kr";
  if (nav.startsWith("ja")) return "jp";
  if (nav.startsWith("zh")) return /hant|tw|hk|mo/.test(nav) ? "tc" : "sc";
  if (nav.startsWith("es")) return "sp";
  if (nav.startsWith("pt")) return "pt";
  if (nav.startsWith("vi")) return "vi";
  if (nav.startsWith("th")) return "th";
  return "en";
}

const sel = $("#lang-select");
sel.innerHTML = LANGS.map(l => `<option value="${l.k}">${l.name}</option>`).join("");
const start = initialLang();
sel.value = start;
render(start);
sel.addEventListener("change", () => {
  try { localStorage.setItem("bf-lang", sel.value); } catch (e) {}
  render(sel.value);
});
if (location.hash) {
  const el = document.getElementById(location.hash.slice(1));
  if (el) requestAnimationFrame(() => el.scrollIntoView());
}
</script>
