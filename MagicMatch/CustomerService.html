    /* 전체 페이지 스타일 */
    body {

    }

    /* 본문 컨테이너: 가운데 정렬 + 데스크톱 줄 길이 제한 */
    main {

      padding: 20px;

    }

      color: #c5c5c5; /* 구분자(|) 색 */
      margin: 0 0 14px;
    }

    .lang-switch a {
      color: #666;
      text-decoration: none;
      margin: 0 2px;
      white-space: nowrap;
    }

    .lang-switch a:hover {
      text-decoration: underline;
    }

    .lang-switch a.active {
      color: #2E6BE6; /* 현재 언어는 포인트 컬러 강조 */
      font-weight: bold;
      cursor: default;
      text-decoration: none;
    }

      color: #2E6BE6;
      font-size: 24px;
      margin-bottom: 20px; /* 제목과 본문 간 간격 */
    }

    p {
      font-size: 14px; /* 본문 폰트 크기 */

      color: #333; /* 텍스트 색상 */
      margin-bottom: 15px; /* 아래 간격 */

      color: #2E6BE6;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }

    label {
      font-weight: bold;
      margin-top: 10px; /* 필드 간격 */
      display: block; /* 한 줄 차지 */

      width: 100%; /* 필드 전체 넓이 */

      padding: 10px; /* 안쪽 여백 */

      box-sizing: border-box; /* 넓이 계산 포함 */

    button {
      background-color: #2E6BE6; /* 버튼 배경색 */
      color: white; /* 텍스트 색상 */
      cursor: pointer; /* 마우스 커서 변경 */
      border: none; /* 테두리 없음 */
      transition: background-color 0.3s ease; /* 호버 효과 */
    }

    button:hover {
      background-color: #1E4FC4; /* 호버 시 어두운 색상 */
    }

    .output {
      margin-top: 20px;
      padding: 15px;
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* 그림자 효과 */

    .button-link {
      display: inline-block;
      margin: 10px 0;
      padding: 10px 20px;
      background-color: #2E6BE6;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
      text-align: center;
      transition: background-color 0.3s ease; /* 호버 효과 */
    }

    .button-link:hover {
      background-color: #1E4FC4; /* 호버 시 어두운 색상 */
    }

    .fallback-note {

      line-height: 1.6;

      color: #2E6BE6;

    .policy-links {
      margin-top: 30px;
      padding: 18px 0;
      background-color: #1D3E8A; /* 포인트 컬러(#2E6BE6) 계열 진한 네이비 */

    .policy-links .inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .policy-links h2 {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin: 0 0 10px;

    .policy-links .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 32px;

    .policy-links a {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      white-space: nowrap;
    }

    .policy-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      main {
        padding: 12px;
      }

      .lang-switch {
        font-size: 11px;
      }

      .policy-links .inner {
        padding: 0 12px;
      }

      .policy-links .links {
        gap: 10px 20px;
      }

      select, button {
        font-size: 14px;
        padding: 8px;
      }

      h1 {
        font-size: 20px;
      }

      p {
        font-size: 10px;
      }

      .fallback-note {
        font-size: 11px;
      }
    }
  </style>
</head>

              (1) Check the receipt (order ID) of the item you wish to cancel<br>
              → Check the receipt email sent by Apple, or go to [Settings] > [Your Name] > [Media & Purchases] > [Purchase History]<br>
              (2) Include the receipt information and click the button below to submit your inquiry<br><br>

              <strong>3. Account Identification Number</strong><br>
              You can find your account identification number in Lobby > [Settings] (top right) > [Manage My Info].<br>
              Please include it when submitting your inquiry.<br><br>

              * <strong>If you request a refund directly from the store without contacting Customer Support first, your access to the game may be permanently restricted due to payment abuse.</strong><br>
            `
          },
          bug: {
            label: 'Report a Bug',
            subject: '[Teenieping Magic Match][Bug] Inquiry',
            body: '1. Issue description: \r\n2. What happened before and after: \r\n* Please attach a screenshot of the issue if available.',
            message: `
              Hello, this is the Teenieping Magic Match CS Team.<br><br>
              We will investigate the issue based on the information you send us.<br>
              Including a <strong><u>screenshot of the issue and what happened before and after it occurred</u></strong><br>
              helps us greatly in identifying and fixing the cause.<br><br>

              Thank you for your valuable report — we will review it promptly and work on improvements.
            `
          },
          suggestion: {
            label: 'Send a Suggestion',
            subject: '[Teenieping Magic Match][Suggestion] Inquiry',
            body: '1. Details: ',
            message: `
              Hello, this is the Teenieping Magic Match CS Team.<br><br>

              Please send us your suggestions through the inquiry below.<br>
              We will <strong><u>review them carefully and do our best to apply them</u></strong>.
            `
          }
        }
      }
    };

    let curLang = 'ko';

    /* 브라우저/URL 언어 코드를 지원 언어 2종(ko/en) 중 하나로 정규화 (미지원이면 null) */
    function normalizeLang(code) {
      if (!code) return null;
      const c = String(code).toLowerCase().replace(/_/g, '-');
      if (c.startsWith('ko')) return 'ko';
      if (c.startsWith('en')) return 'en';
      return null;
    }

    /* 우선순위: URL ?lang= > localStorage(수동 선택) > 브라우저 언어 목록 > en */
    function detectLang() {
      const fromParam = normalizeLang(new URLSearchParams(location.search).get('lang'));
      if (fromParam) return fromParam;

      try {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved && I18N[saved]) return saved;
      } catch (e) { /* localStorage 차단 환경 */ }

      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || 'en'];
      for (const pref of prefs) {
        const match = normalizeLang(pref);
        if (match) return match;
      }
      return 'en';
    }

    function setLang(code, persist) {
      curLang = I18N[code] ? code : 'en';
      const t = I18N[curLang];

      if (persist) {
        try { localStorage.setItem(LANG_KEY, curLang); } catch (e) { /* localStorage 차단 환경 */ }
      }

      document.documentElement.lang = t.langAttr;
      document.title = t.title;
      document.getElementById('t-h1').textContent = t.h1;
      document.getElementById('t-intro').innerHTML = t.intro;
      document.getElementById('t-csmail').innerHTML = t.csMail.replace('{email}', CS_EMAIL);
      document.getElementById('t-community').innerHTML = t.community.replace('{link}',
        `<a href="${DISCORD_URL}" target="_blank" rel="noopener">Discord</a>`);
      document.getElementById('t-cat-label').textContent = t.categoryLabel;
      document.getElementById('t-submit').textContent = t.submit;

      const select = document.getElementById('category');
      for (const option of select.options) {
        option.textContent = option.value ? t.options[option.value] : t.placeholder;
      }

      document.getElementById('t-footer-h2').textContent = t.footerH2;
      document.getElementById('footer-links').innerHTML = t.footerLinks
        .map(link => `<a href="${link.href}" target="_blank" rel="noopener">${link.label}</a>`)
        .join('');

      document.querySelectorAll('.lang-switch a').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === curLang);
      });

      /* 이미 안내문이 열려 있으면 새 언어로 다시 렌더 */
      if (document.getElementById('output').style.display === 'block' && select.value) {
        renderInquiry(select.value);
      }
    }

    /* 모바일 기기 판별 (데스크톱 모드 아이패드는 Macintosh UA + 터치 지원으로 구분) */
    function isMobile() {
      const ua = navigator.userAgent;
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(ua)
        || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    }

    /* 모바일: 기본 메일 앱(mailto) / PC: Gmail 웹 작성 화면 */
    function buildMailHref(inquiry, mobile) {
      const subject = encodeURIComponent(inquiry.subject);
      const body = encodeURIComponent(inquiry.body);
      return mobile
        ? 'mailto:' + CS_EMAIL + '?subject=' + subject + '&body=' + body
        : 'https://mail.google.com/mail/?view=cm&fs=1&to=' + CS_EMAIL + '&su=' + subject + '&body=' + body;
    }

    /* 메일 앱/Gmail을 쓰지 않는 유저용: 받는 주소+제목+본문 양식을 클립보드에 복사 */
    function copyTemplate(category) {
      const t = I18N[curLang];
      const inquiry = t.inquiries[category];
      const text = t.copyTo + CS_EMAIL + '\n' + t.copySubject + inquiry.subject + '\n\n'
        + inquiry.body.replace(/\r\n/g, '\n');

      const linkEl = document.getElementById('copy-template');
      const markDone = () => {
        const original = linkEl.textContent;
        linkEl.textContent = t.copyDone;
        setTimeout(() => { linkEl.textContent = original; }, 2000);
      };
      const fallbackCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { /* 미지원 브라우저 */ }
        document.body.removeChild(ta);
        if (ok) markDone();
        else alert(t.copyFail + '\n' + t.copyTo + CS_EMAIL + '\n' + t.copySubject + inquiry.subject);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markDone, fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    /* 선택된 유형의 안내문 + 접수 버튼 렌더 (언어 전환 시 재사용) */
    function renderInquiry(category) {
      const t = I18N[curLang];
      const inquiry = t.inquiries[category];
      const mobile = isMobile();
      const href = buildMailHref(inquiry, mobile);

      const copyLink = `<a href="#" id="copy-template" onclick="copyTemplate('${category}'); return false;">${t.copyLinkLabel}</a>`;
      const note = t.fallbackNote
        .replace('{copyLink}', copyLink)
        .replace('{email}', CS_EMAIL);

      // mailto는 새 탭이 필요 없고(빈 탭 방지), Gmail 웹 작성 화면은 새 탭으로 연다
      const links = `
        <a href="${href}"${mobile ? '' : ' target="_blank" rel="noopener"'} class="button-link">${inquiry.label}</a>
        <p class="fallback-note">${note}</p>
      `;

      document.getElementById('message').innerHTML = inquiry.message;
      document.getElementById('links').innerHTML = links;
      document.getElementById('output').style.display = 'block';
    }

    function handleInquiry() {
      const category = document.getElementById('category').value;

      // 문의 유형이 선택되지 않았을 경우
      if (!category) {
        alert(I18N[curLang].alertSelect);
        return;
      }

      renderInquiry(category);
    }

    /* 수동 언어 전환: 클릭한 언어를 저장해 재방문 시 유지 */
    document.querySelectorAll('.lang-switch a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        setLang(a.dataset.lang, true);
      });
    });

    setLang(detectLang(), false);
  </script>
</body>
</html>
