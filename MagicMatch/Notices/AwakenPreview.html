<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 각성 시스템 플레이어용 안내(2026-10-21 작성). 단독으로 열리는 자기완결 문서다 — 이미지는 base64로 내장했고 외부 파일이 없다.
     5개 언어(ko·en·ja·zh-Hant·zh-Hans)를 한 파일에 담았다. 언어는 ?lang= → 저장값 → 브라우저 언어 순으로 고른다.
     용어·효과 문장은 LocalizationTable.g.json(AWAKENING_EFFECT_*, UI_AWAKENING_*, CURRENCY_*)의 값을 그대로 썼고,
     효과 수치는 AwakeningEffectTable.g.json(TriggerParameter·ActionParameter)을 옮긴 것이다 — 밸런스 패치 시 DATA.effects를 갱신할 것.
     이미지 원본: TMagicMatch Assets/BundledAssets/Commons/Icons/{FormlessShard,LegendFormlessShard,MoonCrystal}.png,
     Assets/BundledAssets/Lobbies/CharacterPopups/Sprites/Awakning/{Slot,Tier*TabButton,AwakningSlotsBackground}.png.
     규칙 정본: TServer Docs/Awakening.md -->
<title>각성 안내 · 티니핑 매직 매치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
  html { color-scheme: light dark; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --ground: #F4F2FB;
    --surface: #FFFFFF;
    --surface-sunk: #ECE8F8;
    --ink: #1E1A3D;
    --ink-soft: #5B5680;
    --line: #DDD8EE;
    --accent: #6C4FD8;
    --accent-soft: #EEE9FC;
    --accent-ink: #3D2C8F;
    --gold: #D9960F;
    --gold-soft: #FBF0D2;
    --gold-ink: #6B4700;
    --ok: #1F7D5C;
    --ok-soft: #DDF1E8;
    --warn: #B4412A;
    --warn-soft: #FBE6DF;
    --tier-a: #EE2A2B;
    --tier-b: #4080FF;
    --tier-c: #41DF40;
    --tier-d: #9F9F9F;
    --font-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-en: "IBM Plex Sans KR", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-ja: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-hant: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-hans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #100C2A;
      --surface: #1A1540;
      --surface-sunk: #130F33;
      --ink: #EFEBFF;
      --ink-soft: #ABA4D4;
      --line: #2E2860;
      --accent: #A08CF0;
      --accent-soft: #2A2160;
      --accent-ink: #D9D0FF;
      --gold: #F2C14E;
      --gold-soft: #3A3117;
      --gold-ink: #FBE3A3;
      --ok: #62C9A0;
      --ok-soft: #17382F;
      --warn: #F0907A;
      --warn-soft: #40211B;
    }
  }
  :root[data-theme="dark"] {
    --ground: #100C2A;
    --surface: #1A1540;
    --surface-sunk: #130F33;
    --ink: #EFEBFF;
    --ink-soft: #ABA4D4;
    --line: #2E2860;
    --accent: #A08CF0;
    --accent-soft: #2A2160;
    --accent-ink: #D9D0FF;
    --gold: #F2C14E;
    --gold-soft: #3A3117;
    --gold-ink: #FBE3A3;
    --ok: #62C9A0;
    --ok-soft: #17382F;
    --warn: #F0907A;
    --warn-soft: #40211B;
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--font-ko); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  html[lang="en"] body { font-family: var(--font-en); }
  html[lang="ja"] body { font-family: var(--font-ja); }
  html[lang="zh-Hant"] body { font-family: var(--font-hant); }
  html[lang="zh-Hans"] body { font-family: var(--font-hans); }
  * { box-sizing: border-box; }
  h1, h2, h3, p { margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; }

  .langbar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; padding: 12px 0 10px; }
  .langbar button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .langbar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .langbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hero { position: relative; border-radius: 18px; overflow: hidden; color: #F6F3FF; background: #1A1452 center / cover no-repeat; min-height: 220px; display: flex; align-items: flex-end; padding: 28px 24px 24px; isolation: isolate; }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,70,.15) 0%, rgba(20,14,70,.78) 100%); z-index: -1; }
  .hero .kicker { font-size: 13px; letter-spacing: .04em; color: #D6CEFF; margin-bottom: 6px; }
  .hero h1 { font-size: 2rem; line-height: 1.2; font-weight: 700; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .hero p { font-size: .98rem; max-width: 34em; color: #ECE7FF; text-shadow: 0 1px 6px rgba(0,0,0,.35); }

  section { margin-top: 28px; }
  section > h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  section > h2::before { content: ""; width: 6px; height: 1.1em; border-radius: 3px; background: var(--gold); }
  section > p { font-size: .98rem; }
  .note { background: var(--surface-sunk); border-radius: 12px; padding: 12px 14px; font-size: .9rem; color: var(--ink-soft); margin-top: 12px; }
  .note.accent { background: var(--accent-soft); color: var(--accent-ink); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; }
  .card .ic { width: 56px; height: 56px; display: block; margin-bottom: 8px; }
  .card b { display: block; font-size: .98rem; font-weight: 700; margin-bottom: 4px; }
  .card small { display: block; font-size: .86rem; color: var(--ink-soft); line-height: 1.6; }

  .steps { display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px; }
  .step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .95rem; }
  .step b { display: block; font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
  .step p { font-size: .93rem; }
  .step .with-art { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
  @media (max-width: 480px) { .step .with-art { grid-template-columns: 1fr; } .step .with-art .art { justify-self: center; } }
  .emblem { position: relative; width: 150px; height: 144px; flex: none; }
  .emblem .slot { position: absolute; width: 46px; height: 46px; background: center / contain no-repeat; }
  .emblem .slot.on::after { content: ""; position: absolute; inset: 8px; background: center / contain no-repeat; }
  .emblem .slot:nth-child(1) { left: 52px; top: 0; }
  .emblem .slot:nth-child(2) { left: 102px; top: 38px; }
  .emblem .slot:nth-child(3) { left: 84px; top: 96px; }
  .emblem .slot:nth-child(4) { left: 20px; top: 96px; }
  .emblem .slot:nth-child(5) { left: 2px; top: 38px; }
  .moon-art { width: 72px; height: 72px; }
  .result { display: grid; gap: 8px; margin-top: 6px; }
  .result div { border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
  .result .ok { background: var(--ok-soft); color: var(--ok); }
  .result .ng { background: var(--warn-soft); color: var(--warn); }
  .result b { font-weight: 700; font-size: .92rem; margin-bottom: 0; display: inline; }

  .tiers { display: flex; gap: 6px; margin: 4px 0 12px; }
  .tier { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 7px; font-weight: 700; font-size: .85rem; color: #fff; }
  .tier.A { background: var(--tier-a); } .tier.B { background: var(--tier-b); } .tier.C { background: var(--tier-c); color: #0C3A0C; } .tier.D { background: var(--tier-d); }

  .filters { display: grid; gap: 8px; margin-bottom: 14px; }
  .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-row .lbl { font-size: .85rem; color: var(--ink-soft); min-width: 3.2em; }
  .tabbtn { font: inherit; font-weight: 700; font-size: .95rem; color: #fff; width: 64px; height: 36px; border: 0; padding: 0 0 2px; cursor: pointer; background: transparent center / 100% 100% no-repeat; text-shadow: 0 1px 2px rgba(0,0,0,.35); opacity: .42; filter: saturate(.5); transition: opacity .15s, transform .1s; }
  .tabbtn[aria-pressed="true"] { opacity: 1; filter: none; transform: translateY(-1px); }
  .tabbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .pill { font: inherit; font-size: .88rem; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .group { margin-top: 16px; }
  .group h3 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .group h3 small { font-weight: 400; font-size: .82rem; color: var(--ink-soft); }
  .eff { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: .93rem; }
  .eff .tier { height: 22px; min-width: 22px; font-size: .78rem; margin-top: 2px; }
  .eff .role { font-size: .76rem; border-radius: 999px; padding: 2px 8px; background: var(--surface-sunk); color: var(--ink-soft); white-space: nowrap; margin-top: 2px; }
  .eff .role.Main { background: var(--gold-soft); color: var(--gold-ink); }
  .eff .role.Sub { background: var(--accent-soft); color: var(--accent-ink); }
  .empty { color: var(--ink-soft); font-size: .9rem; padding: 12px 0; }
  footer { text-align: center; color: var(--ink-soft); font-size: .8rem; padding: 28px 0 8px; }
</style>
</head>
<body>
<main>
  <nav class="langbar" aria-label="Language">
    <button type="button" data-lang="ko" lang="ko">한국어</button>
    <button type="button" data-lang="en" lang="en">English</button>
    <button type="button" data-lang="ja" lang="ja">日本語</button>
    <button type="button" data-lang="zh-Hant" lang="zh-Hant">繁體中文</button>
    <button type="button" data-lang="zh-Hans" lang="zh-Hans">简体中文</button>
  </nav>

  <header class="hero" id="hero">
    <div>
      <div class="kicker" data-i18n="game"></div>
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.sub"></p>
    </div>
  </header>

  <section>
    <h2 data-i18n="s1.h"></h2>
    <p data-i18n="s1.p"></p>
  </section>

  <section>
    <h2 data-i18n="s2.h"></h2>
    <div class="cards">
      <div class="card"><img class="ic" id="img-essence" alt=""><b data-i18n="cur.essence"></b><small data-i18n="cur.essence.d"></small></div>
      <div class="card"><img class="ic" id="img-legend" alt=""><b data-i18n="cur.legend"></b><small data-i18n="cur.legend.d"></small></div>
      <div class="card"><img class="ic" id="img-moon" alt=""><b data-i18n="cur.moon"></b><small data-i18n="cur.moon.d"></small></div>
    </div>
    <div class="note" data-i18n="s2.note"></div>
  </section>

  <section>
    <h2 data-i18n="s3.h"></h2>
    <div class="steps">
      <div class="step"><div class="n">1</div><div><b data-i18n="st1.t"></b><p data-i18n="st1.d"></p></div></div>
      <div class="step"><div class="n">2</div><div class="with-art"><div><b data-i18n="st2.t"></b><p data-i18n="st2.d"></p></div>
        <div class="art emblem" aria-hidden="true"><span class="slot on"></span><span class="slot on"></span><span class="slot on"></span><span class="slot"></span><span class="slot"></span></div></div></div>
      <div class="step"><div class="n">3</div><div class="with-art"><div><b data-i18n="st3.t"></b><p data-i18n="st3.d"></p></div><img class="art moon-art" id="img-moon2" alt="" aria-hidden="true"></div></div>
      <div class="step"><div class="n">4</div><div><b data-i18n="st4.t"></b>
        <div class="result">
          <div class="ok"><b data-i18n="st4.ok"></b> · <span data-i18n="st4.okd"></span></div>
          <div class="ng"><b data-i18n="st4.ng"></b> · <span data-i18n="st4.ngd"></span></div>
        </div></div></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="s4.h"></h2>
    <p data-i18n="s4.p"></p>
    <div class="note accent" data-i18n="s4.note"></div>
  </section>

  <section>
    <h2 data-i18n="s5.h"></h2>
    <div class="tiers" aria-hidden="true"><span class="tier D">D</span><span class="tier C">C</span><span class="tier B">B</span><span class="tier A">A</span></div>
    <p data-i18n="s5.p"></p>
    <div class="cards" style="margin-top:12px">
      <div class="card"><b data-i18n="role.any"></b><small data-i18n="role.any.d"></small></div>
      <div class="card"><b data-i18n="role.main"></b><small data-i18n="role.main.d"></small></div>
      <div class="card"><b data-i18n="role.sub"></b><small data-i18n="role.sub.d"></small></div>
    </div>
    <div class="note" data-i18n="s5.note"></div>
  </section>

  <section>
    <h2 data-i18n="s6.h"></h2>
    <div class="filters">
      <div class="filter-row"><span class="lbl" data-i18n="f.tier"></span>
        <button type="button" class="tabbtn" data-tier="all" data-i18n="all"></button>
        <button type="button" class="tabbtn" data-tier="A">A</button>
        <button type="button" class="tabbtn" data-tier="B">B</button>
        <button type="button" class="tabbtn" data-tier="C">C</button>
        <button type="button" class="tabbtn" data-tier="D">D</button>
      </div>
      <div class="filter-row"><span class="lbl" data-i18n="f.role"></span>
        <button type="button" class="pill" data-role="all" data-i18n="all"></button>
        <button type="button" class="pill" data-role="Any" data-i18n="chip.Any"></button>
        <button type="button" class="pill" data-role="Main" data-i18n="chip.Main"></button>
        <button type="button" class="pill" data-role="Sub" data-i18n="chip.Sub"></button>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <section>
    <div class="note" data-i18n="s7.note" style="margin-top:0"></div>
  </section>

  <footer data-i18n="footer"></footer>
</main>

<script>

const LANGS = ["ko", "en", "ja", "zh-Hant", "zh-Hans"];
const TIERS = ["A", "B", "C", "D"];
let lang = "ko", tierFilter = "all", roleFilter = "all";

function t(key) {
  const s = STRINGS[lang][key];
  if (s === undefined) { console.warn("missing string", lang, key); return STRINGS.ko[key] || key; }
  return s;
}
function effectText(e) {
  const tpl = DATA.texts[lang][e.id];
  if (tpl === undefined) { console.warn("missing effect text", lang, e.id); return e.id; }
  return tpl.replace(/\{0\}/g, e.p0).replace(/\{1\}/g, e.p1);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }

function renderList() {
  let html = "", total = 0;
  for (const tier of TIERS) {
    if (tierFilter !== "all" && tierFilter !== tier) continue;
    const rows = DATA.effects.filter(e => e.tier === tier && (roleFilter === "all" || e.role === roleFilter));
    if (!rows.length) continue;
    total += rows.length;
    html += `<div class="group"><h3><span class="tier ${tier}">${tier}</span>${esc(t("group").replace("{t}", tier))} <small>${esc(t("count").replace("{n}", rows.length))}</small></h3>`;
    for (const e of rows) html += `<div class="eff"><span class="tier ${e.tier}">${e.tier}</span><span class="role ${e.role}">${esc(t("chip." + e.role))}</span><span>${esc(effectText(e))}</span></div>`;
    html += "</div>";
  }
  document.getElementById("list").innerHTML = total ? html : `<div class="empty">${esc(t("empty"))}</div>`;
}

function applyLang(next) {
  if (!LANGS.includes(next)) next = "ko";
  lang = next;
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".langbar button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderList();
  try { localStorage.setItem("awakening-guide-lang", lang); } catch (e) {}
  try { const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); } catch (e) {}
}

function detectLang() {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q && LANGS.includes(q)) return q; } catch (e) {}
  try { const s = localStorage.getItem("awakening-guide-lang"); if (s && LANGS.includes(s)) return s; } catch (e) {}
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("ko")) return "ko";
  if (nav.startsWith("ja")) return "ja";
  if (nav.startsWith("zh")) return /hans|cn|sg/.test(nav) ? "zh-Hans" : "zh-Hant";
  return "en";
}

(function init() {
  const I = DATA.images;
  document.getElementById("hero").style.backgroundImage = `url(${I.hero})`;
  document.getElementById("img-essence").src = I.essence;
  document.getElementById("img-legend").src = I.legendEssence;
  document.getElementById("img-moon").src = I.moon;
  document.getElementById("img-moon2").src = I.moon;
  document.querySelectorAll(".emblem .slot").forEach(s => { s.style.backgroundImage = `url(${I.slot})`; });
  const style = document.createElement("style");
  style.textContent = `.emblem .slot.on::after{background-image:url(${I.essence})}` +
    `.tabbtn[data-tier="all"]{background-image:url(${I.tabAll})}.tabbtn[data-tier="A"]{background-image:url(${I.tabA})}` +
    `.tabbtn[data-tier="B"]{background-image:url(${I.tabB})}.tabbtn[data-tier="C"]{background-image:url(${I.tabC})}.tabbtn[data-tier="D"]{background-image:url(${I.tabD})}`;
  document.head.appendChild(style);

  document.querySelectorAll(".langbar button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
  const syncPressed = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val)));
  document.querySelectorAll(".tabbtn").forEach(b => b.addEventListener("click", () => { tierFilter = b.dataset.tier; syncPressed(".tabbtn", "tier", tierFilter); renderList(); }));
  document.querySelectorAll(".pill").forEach(b => b.addEventListener("click", () => { roleFilter = b.dataset.role; syncPressed(".pill", "role", roleFilter); renderList(); }));
  syncPressed(".tabbtn", "tier", "all"); syncPressed(".pill", "role", "all");
  applyLang(detectLang());
})();
</script>
